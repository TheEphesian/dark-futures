[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dark-futures"
version = "0.1.0"
description = "Turn-based wartime country simulator with TUI, Web UI, and MCP interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80.0",
    "textual-web>=0.8.0",
    "numpy>=1.26.0",
    "pyOpenSSL>=24.0.0",
]

[project.scripts]
dark-futures = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
